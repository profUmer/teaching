project:
  render:
    # Scoped to the decks that are ready; vectors and motion aren't yet. Add
    # a deck here when it is, then publish it with tools\publish.ps1.
    # A deck NOT listed here renders without any of this file (no theme,
    # footer, author, slides.css or labs) - even `quarto render x.qmd`.
    - matrices.qmd
    - matrixInverse.qmd
    - dualQuaternions.qmd
    - matricesIn3d.qmd
    - rayIntersections.qmd
    - vectorOperations.qmd
    - bulletHell.qmd
    - slice.qmd
  # No `type: website`, so this is a plain project - which is why
  # `quarto publish gh-pages` refuses it: Quarto publishes a plain project
  # only while it has exactly one deck to render (TUTORIAL.md §8). Publish
  # with tools\publish.ps1 instead. A `resources:` list here would not help
  # either: Quarto honours it only for website and book projects (tried
  # 2026-09-24, no effect).

author: "Umer Noor, PhD"
date: today
date-format: "[Demos built using Claude Code]"
format:
  revealjs:
    theme: [default, assets/humber.scss]
    css: assets/slides.css
    include-in-header: assets/head.html
    footer: "Game Math 1, Umer Noor, PhD"
    width: 1280
    height: 720
    slide-number: c/t
    progress: true
    history: true
    chalkboard: true        # press 'b' to draw on a slide during class
    preview-links: auto
    # SVG output, pinned. The default (CHTML) keeps all its layout in a
    # stylesheet that MathJax 4 builds through the CSSOM, so anything that
    # re-inserts <style> tags (some browser extensions do) strips it and the
    # math falls apart - students saw matrices strung out on one line with
    # brackets broken into | | |. SVG carries its layout inside each formula.
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-svg.js"
